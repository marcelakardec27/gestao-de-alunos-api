# CI de Nível 01 - Disparo Manual através de clique e Push na Master
name: 'N1 - Execução Manual'

# gatilhos / triggers - regras de disparo
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - testes-automatizados

# tarefas dentro da pipeline = jobs
jobs:
  mocha-tests:
    # máquina onde o job vai rodar
    runs-on: ubuntu-24.04

    # passos do job
    steps:
      # clone do projeto para dentro da máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v7

      # instalação do Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # instalação do Yarn globalmente
      - name: Instalando Yarn
        run: npm install -g yarn

      # instalação das dependências usando o Yarn
      - name: Instalando dependências
        run: yarn install

      # iniciar a API para o teste externo via SuperTest
      - name: Iniciando API
        run: |
          yarn start > api.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      # executar os testes Mocha e gerar o relatório Mochawesome
      - name: Executando testes com Mocha
        run: npx mocha "test/Externo/alunos.externo.test.js" --reporter mochawesome --reporter-options reportDir=mochawesome-report,overwrite=true,html=true,json=true

      # Salvar relatórios (Garante o upload da pasta correta mesmo se o teste falhar)
      - name: Salvando relatórios de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Relatório de Testes Mochawesome
          path: mochawesome-report/