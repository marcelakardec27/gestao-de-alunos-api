# CI de Nível 04 - Pipeline Integrada ao Build do Código
name: 'N4 - Execução Integrada'

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - testes-automatizados

env:
  NODE_VERSION: '24.x'

jobs:
  # Job 1: Inspeção de sintaxe JavaScript
  inspecao:
    runs-on: ubuntu-latest
    steps:
      - name: Clone do projeto
        uses: actions/checkout@v4

      - name: Configuração do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalando Yarn globalmente
        run: npm install -g yarn

      - name: Instalando dependências com Yarn
        run: yarn install

      - name: Verificar sintaxe JavaScript
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check

  # Job 2: Testes com Mocha
  unidade:
    runs-on: ubuntu-latest
    needs: [inspecao]
    if: always() # Garante a execução dos testes independentemente do linter
    steps:
      - name: Clone do projeto
        uses: actions/checkout@v4

      - name: Configuração do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalando Yarn globalmente
        run: npm install -g yarn

      - name: Instalando dependências com Yarn
        run: yarn install

      - name: Iniciar API para os testes externos
        run: |
          yarn start > api.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: Rodar testes com Mocha
        run: yarn test --reporter mochawesome --reporter-options reportDir=mochawesome-report,overwrite=true,html=true,json=true

      - name: Salvando relatório de testes unitários
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-unitario-mocha
          path: ./mochawesome-report/
          if-no-files-found: ignore
          retention-days: 7

  # Job 3: Deploy (Conectado apenas ao que realmente existe)
  deploy:
    runs-on: ubuntu-latest
    needs: [unidade] # CORREÇÃO: Depende apenas do job 'unidade' que já está a passar com sucesso!
    steps:
      - name: Simulação de Deploy
        run: echo 'Deploy sendo realizado... Código validado com Mocha!'